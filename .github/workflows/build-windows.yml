name: Windows Build

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config:
          # Codec-coverage checks (x64, default shared + static)
          - name: x64-all-codecs
            platform: x64
            triplet: x64-windows
            cmake_flags: "-DBUILD_ALL_CODECS=ON -DBUILD_ENCODERS=ON -DBUILD_DECODERS=ON"
          - name: x64-decoder-only
            platform: x64
            triplet: x64-windows
            cmake_flags: "-DBUILD_ALL_CODECS=ON -DBUILD_ENCODERS=OFF -DBUILD_DECODERS=ON"
          - name: x64-pcm-vorbis
            platform: x64
            triplet: x64-windows
            cmake_flags: "-DCODEC_VORBIS=ON -DCODEC_OPUS=OFF -DCODEC_FLAC=OFF -DCODEC_MP3=OFF -DCODEC_AAC=OFF"
          # 32-bit toolchain check
          - name: x86-all-codecs
            platform: Win32
            triplet: x86-windows
            cmake_flags: "-DBUILD_ALL_CODECS=ON -DBUILD_ENCODERS=ON -DBUILD_DECODERS=ON"
          # Self-contained DLL checks (static triplet + shared lib + static CRT) -
          # exercises the CRT/link path used by the release "shared-bundled" zips.
          - name: x64-self-contained-dll
            platform: x64
            triplet: x64-windows-static
            cmake_flags: "-DBUILD_ALL_CODECS=ON -DBUILD_ENCODERS=ON -DBUILD_DECODERS=ON -DBUILD_SHARED=ON -DBUILD_STATIC_FULL=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          - name: x86-self-contained-dll
            platform: Win32
            triplet: x86-windows-static
            cmake_flags: "-DBUILD_ALL_CODECS=ON -DBUILD_ENCODERS=ON -DBUILD_DECODERS=ON -DBUILD_SHARED=ON -DBUILD_STATIC_FULL=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # vcpkg's GHA binary cache backend (enabled by default in lukka/run-vcpkg)
    # needs ACTIONS_CACHE_URL + ACTIONS_RUNTIME_TOKEN exported from the
    # actions runtime; without these, `vcpkg install` aborts with
    # "The GHA binary source requires the ACTIONS_RUNTIME_TOKEN and
    # ACTIONS_CACHE_URL environment variables to be set."
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -A ${{ matrix.config.platform }} `
          ${{ matrix.config.cmake_flags }} `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_TOOLS=OFF `
          -DBUILD_TESTS=OFF `
          -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.config.triplet }}

    - name: Build
      run: |
        cd build
        cmake --build . --config Release -j $env:NUMBER_OF_PROCESSORS

    - name: Verify DLL exports the public API
      run: |
        $dll = "build/Release/muxaudio.dll"
        if (-not (Test-Path $dll)) {
          Write-Host "No muxaudio.dll built (static-only config); skipping."
          exit 0
        }
        # dumpbin isn't on PATH in the default shell; locate it via vswhere.
        $dumpbinExe = (Get-Command dumpbin -ErrorAction SilentlyContinue).Source
        if (-not $dumpbinExe) {
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbinExe = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        }
        if (-not $dumpbinExe) {
          Write-Error "dumpbin.exe not found - cannot verify DLL exports."
          exit 1
        }
        Write-Host "Using dumpbin: $dumpbinExe"
        $exports = & $dumpbinExe /exports $dll | Out-String
        Write-Host $exports
        if ($exports -match 'mux_encoder_new') {
          Write-Host "OK: muxaudio.dll exports the public API."
        } else {
          Write-Error "muxaudio.dll exports no mux_ symbols - import lib would be empty."
          exit 1
        }

    - name: Copy Codec DLLs (shared-external only)
      run: |
        $vcpkgBin = "$env:VCPKG_ROOT/installed/${{ matrix.config.triplet }}/bin"
        if (Test-Path $vcpkgBin) {
          Copy-Item "$vcpkgBin/*.dll" build/Release/ -ErrorAction SilentlyContinue
        }

    - name: Display Build Info
      run: |
        cd build/Release
        echo "=== DLL Files ==="
        Get-ChildItem *.dll -ErrorAction SilentlyContinue | Format-Table Name, Length
        echo "=== LIB Files ==="
        Get-ChildItem *.lib -ErrorAction SilentlyContinue | Format-Table Name, Length

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-${{ matrix.config.name }}
        path: |
          build/Release/*.dll
          build/Release/*.lib
        retention-days: 30
