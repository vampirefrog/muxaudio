name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-linux-shared:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libogg-dev \
          libvorbis-dev \
          libopus-dev \
          libflac-dev \
          libmpg123-dev \
          libmp3lame-dev \
          libfdk-aac-dev

    - name: Build Shared Library
      run: |
        mkdir build
        cd build
        cmake .. \
          -DBUILD_ALL_CODECS=ON \
          -DBUILD_ENCODERS=ON \
          -DBUILD_DECODERS=ON \
          -DBUILD_SHARED=ON \
          -DBUILD_STATIC_FULL=OFF \
          -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Package Shared Library
      run: |
        mkdir -p release/linux-x64-shared
        cp build/libmuxaudio.so build/mux build/demux release/linux-x64-shared/
        cp -P /usr/lib/x86_64-linux-gnu/libogg.so* release/linux-x64-shared/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libvorbis.so* release/linux-x64-shared/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libvorbisenc.so* release/linux-x64-shared/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libopus.so* release/linux-x64-shared/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libFLAC.so* release/linux-x64-shared/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libmpg123.so* release/linux-x64-shared/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libmp3lame.so* release/linux-x64-shared/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libfdk-aac.so* release/linux-x64-shared/ || true
        cd release
        tar czf muxaudio-linux-x64-shared.tar.gz linux-x64-shared/

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: linux-shared-release
        path: release/muxaudio-linux-x64-shared.tar.gz
        retention-days: 1

  build-linux-static:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libogg-dev \
          libvorbis-dev \
          libopus-dev \
          libflac-dev \
          libmpg123-dev \
          libmp3lame-dev \
          libfdk-aac-dev

    - name: Build Static Library
      run: |
        mkdir build
        cd build
        cmake .. \
          -DBUILD_ALL_CODECS=ON \
          -DBUILD_ENCODERS=ON \
          -DBUILD_DECODERS=ON \
          -DBUILD_SHARED=OFF \
          -DBUILD_STATIC_FULL=ON \
          -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Package Static Library
      run: |
        mkdir -p release/linux-x64-static
        cp build/libmuxaudio-static.a release/linux-x64-static/
        cp -P /usr/lib/x86_64-linux-gnu/libogg.a release/linux-x64-static/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libvorbis.a release/linux-x64-static/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libvorbisenc.a release/linux-x64-static/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libopus.a release/linux-x64-static/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libFLAC.a release/linux-x64-static/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libmpg123.a release/linux-x64-static/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libmp3lame.a release/linux-x64-static/ || true
        cp -P /usr/lib/x86_64-linux-gnu/libfdk-aac.a release/linux-x64-static/ || true

        # Create README with linking instructions
        cat > release/linux-x64-static/README.txt << 'EOF'
        MuxAudio Static Library Build
        ==============================

        This package contains libmuxaudio-static.a and all required codec static libraries.

        To link against this library in your project:

        gcc yourapp.c -o yourapp \
          -L. -lmuxaudio-static \
          -lvorbisenc -lvorbis -lopus -lFLAC -lmp3lame -lmpg123 -lfdk-aac -logg \
          -lm

        Or with CMake:

        target_link_libraries(yourapp
          ${CMAKE_CURRENT_SOURCE_DIR}/libmuxaudio-static.a
          vorbisenc vorbis opus FLAC mp3lame mpg123 fdk-aac ogg m
        )
        EOF

        cd release
        tar czf muxaudio-linux-x64-static.tar.gz linux-x64-static/

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: linux-static-release
        path: release/muxaudio-linux-x64-static.tar.gz
        retention-days: 1

  build-deb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debhelper \
          devscripts \
          build-essential \
          cmake \
          pkg-config \
          libogg-dev \
          libvorbis-dev \
          libopus-dev \
          libflac-dev \
          libmpg123-dev \
          libmp3lame-dev \
          libfdk-aac-dev

    - name: Update Version in debian/changelog
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        if [ -z "$VERSION" ]; then
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"
        fi
        if [ -z "$VERSION" ]; then
          VERSION="0.1.0"
        fi

        # Update changelog with version and timestamp
        TIMESTAMP=$(date -R)
        sed -i "1s/UNRELEASED/unstable/" debian/changelog
        sed -i "1s/(0.1.0-1)/($VERSION-1)/" debian/changelog
        sed -i "s/Thu, 23 Jan 2025 20:00:00 +0000/$TIMESTAMP/" debian/changelog

    - name: Build Debian Package
      run: |
        dpkg-buildpackage -us -uc -b

    - name: Package Artifacts
      run: |
        mkdir -p release
        mv ../*.deb release/
        ls -lh release/

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: deb-packages
        path: release/*.deb
        retention-days: 1

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64-shared
            platform: x64
            triplet: x64-windows
            kind: shared-external
            cmake_flags: "-DBUILD_SHARED=ON -DBUILD_STATIC_FULL=OFF"
          - name: x86-shared
            platform: Win32
            triplet: x86-windows
            kind: shared-external
            cmake_flags: "-DBUILD_SHARED=ON -DBUILD_STATIC_FULL=OFF"
          - name: x64-shared-bundled
            platform: x64
            triplet: x64-windows-static
            kind: shared-bundled
            cmake_flags: "-DBUILD_SHARED=ON -DBUILD_STATIC_FULL=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          - name: x86-shared-bundled
            platform: Win32
            triplet: x86-windows-static
            kind: shared-bundled
            cmake_flags: "-DBUILD_SHARED=ON -DBUILD_STATIC_FULL=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          - name: x64-static
            platform: x64
            triplet: x64-windows-static
            kind: static
            cmake_flags: "-DBUILD_SHARED=OFF -DBUILD_STATIC_FULL=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          - name: x86-static
            platform: Win32
            triplet: x86-windows-static
            kind: static
            cmake_flags: "-DBUILD_SHARED=OFF -DBUILD_STATIC_FULL=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11

    - name: Install Dependencies
      run: |
        vcpkg install --triplet ${{ matrix.triplet }}

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -A ${{ matrix.platform }} `
          -DBUILD_ALL_CODECS=ON `
          -DBUILD_ENCODERS=ON `
          -DBUILD_DECODERS=ON `
          -DBUILD_TOOLS=OFF `
          -DBUILD_TESTS=OFF `
          ${{ matrix.cmake_flags }} `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
        cmake --build . --config Release -j $env:NUMBER_OF_PROCESSORS

    - name: Package
      env:
        PKG_NAME: windows-${{ matrix.name }}
        KIND: ${{ matrix.kind }}
        TRIPLET: ${{ matrix.triplet }}
      run: |
        $pkgDir = "release/$env:PKG_NAME"
        New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null

        Write-Host "Contents of build/Release:"
        Get-ChildItem build/Release -ErrorAction SilentlyContinue

        # muxaudio outputs: DLL + import lib (shared) or static lib
        Get-ChildItem build/Release -File -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -like 'muxaudio*' -and ($_.Extension -eq '.dll' -or $_.Extension -eq '.lib') } |
          ForEach-Object { Copy-Item $_.FullName $pkgDir/; Write-Host "Copied: $($_.Name)" }

        # Public header
        Copy-Item include/mux.h $pkgDir/
        Write-Host "Copied: mux.h"

        # Codec dependencies, per variant. In vcpkg manifest mode the deps land
        # in a `vcpkg_installed/<triplet>` tree (NOT $VCPKG_ROOT/installed), whose
        # exact root varies, so search the likely locations for the triplet's
        # release bin/lib artifacts.
        function Copy-CodecFiles($subdir, $ext) {
          $roots = @('vcpkg_installed', 'build/vcpkg_installed', 'build') | Where-Object { Test-Path $_ }
          $files = @()
          foreach ($r in $roots) {
            $files += Get-ChildItem -Path $r -Recurse -File -Filter "*.$ext" -ErrorAction SilentlyContinue |
              Where-Object {
                $p = $_.FullName -replace '\\', '/'
                $p -match "/$env:TRIPLET/$subdir/" -and $p -notmatch '/debug/' -and $_.Name -notlike 'muxaudio*'
              }
          }
          $files = $files | Sort-Object Name -Unique
          foreach ($f in $files) { Copy-Item $f.FullName $pkgDir/ -Force; Write-Host "Codec: $($f.Name)" }
          return ($files | Measure-Object).Count
        }

        switch ($env:KIND) {
          'shared-external' {
            if ((Copy-CodecFiles 'bin' 'dll') -eq 0) {
              Write-Error "No codec DLLs found for $env:TRIPLET - external package would be incomplete."
              exit 1
            }
          }
          'static' {
            if ((Copy-CodecFiles 'lib' 'lib') -eq 0) {
              Write-Error "No codec .lib files found for $env:TRIPLET - static package would be incomplete."
              exit 1
            }
          }
          'shared-bundled' {
            Write-Host "Self-contained DLL: codecs linked in, no external codec files."
          }
        }

        # Per-variant README
        switch ($env:KIND) {
          'shared-external' {
            Set-Content -Path $pkgDir/README.txt -Value @(
              "MuxAudio - Shared DLL (external codecs)",
              "=======================================",
              "Link your app against muxaudio.lib and include mux.h.",
              "Ship muxaudio.dll AND the codec DLLs in this archive next to your app.")
          }
          'shared-bundled' {
            Set-Content -Path $pkgDir/README.txt -Value @(
              "MuxAudio - Self-contained Shared DLL",
              "====================================",
              "Codecs are statically linked into muxaudio.dll (static CRT).",
              "Link your app against muxaudio.lib and include mux.h.",
              "Ship only muxaudio.dll - no external codec DLLs are required.")
          }
          'static' {
            Set-Content -Path $pkgDir/README.txt -Value @(
              "MuxAudio - Static Library",
              "=========================",
              "Contains muxaudio-static.lib plus all codec static libraries, and mux.h.",
              "",
              "Linker input:",
              "  muxaudio-static.lib vorbisenc.lib vorbis.lib opus.lib FLAC.lib mpg123.lib fdk-aac.lib ogg.lib",
              "",
              "CMake:",
              "  target_link_libraries(yourapp",
              "    `${CMAKE_CURRENT_SOURCE_DIR}/muxaudio-static.lib",
              "    vorbisenc vorbis opus FLAC mpg123 fdk-aac ogg)")
          }
        }

        Write-Host "Contents of ${pkgDir}:"
        Get-ChildItem $pkgDir
        Compress-Archive -Path $pkgDir -DestinationPath "release/muxaudio-$env:PKG_NAME.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: windows-${{ matrix.name }}
        path: release/muxaudio-windows-${{ matrix.name }}.zip
        retention-days: 1

  build-wasm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v16
      with:
        version: 'latest'

    - name: Build WASM (Decoder Only - All Codecs)
      run: |
        mkdir build
        cd build
        emcmake cmake .. \
          -DBUILD_ALL_CODECS=ON \
          -DBUILD_ENCODERS=OFF \
          -DBUILD_DECODERS=ON \
          -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Package
      run: |
        mkdir -p release/wasm-decoder
        cp build/muxaudio.js release/wasm-decoder/
        cp build/muxaudio.wasm release/wasm-decoder/
        cp wasm/muxaudio.wrapper.js release/wasm-decoder/
        [ -f wasm/test.html ] && cp wasm/test.html release/wasm-decoder/ || true

        # Create build info
        cat > release/wasm-decoder/BUILD_INFO.txt << EOF
        MuxAudio WASM Build
        ===================
        Version: ${GITHUB_REF_NAME}
        Commit: ${GITHUB_SHA}
        Date: $(date -u)

        Configuration:
        - Codecs: PCM, Vorbis, Opus, FLAC, MP3 (decode only)
        - Encoders: Disabled
        - Decoders: Enabled

        Module Size: $(du -h build/muxaudio.wasm | cut -f1)
        EOF

        cd release
        tar czf muxaudio-wasm-decoder.tar.gz wasm-decoder/

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: wasm-release
        path: release/muxaudio-wasm-decoder.tar.gz
        retention-days: 1

  create-release:
    needs: [build-linux-shared, build-linux-static, build-deb, build-windows, build-wasm]
    runs-on: ubuntu-latest

    steps:
    - name: Download Linux Shared Artifact
      uses: actions/download-artifact@v8
      with:
        name: linux-shared-release
        path: release

    - name: Download Linux Static Artifact
      uses: actions/download-artifact@v8
      with:
        name: linux-static-release
        path: release

    - name: Download Debian Packages
      uses: actions/download-artifact@v8
      with:
        name: deb-packages
        path: release

    - name: Download Windows Artifacts (all archs/variants)
      uses: actions/download-artifact@v8
      with:
        pattern: windows-*
        merge-multiple: true
        path: release

    - name: Download WASM Artifact
      uses: actions/download-artifact@v8
      with:
        name: wasm-release
        path: release

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name || github.event.inputs.tag }}
        name: Release ${{ github.ref_name || github.event.inputs.tag }}
        body: |
          ## MuxAudio Release ${{ github.ref_name || github.event.inputs.tag }}

          ### Linux Builds

          **Shared Library (`muxaudio-linux-x64-shared.tar.gz`)**
          - `libmuxaudio.so` - shared library with external codec dependencies
          - `mux`, `demux` - CLI tools
          - All codec shared libraries included (`.so` files)
          - Codecs: PCM, Vorbis, Opus, FLAC, MP3, AAC

          **Static Library (`muxaudio-linux-x64-static.tar.gz`)**
          - `libmuxaudio-static.a` - static library
          - All codec static libraries included (`.a` files)
          - No runtime codec dependencies
          - Includes README with linking instructions
          - Codecs: PCM, Vorbis, Opus, FLAC, MP3, AAC

          **Debian Packages (.deb files)**
          - `libmuxaudio0_*.deb` - Runtime library package
          - `libmuxaudio-dev_*.deb` - Development files (headers, static library)
          - `muxaudio-tools_*.deb` - Command-line tools (mux, demux)
          - Automatic dependency resolution for codec libraries
          - Codecs: PCM, Vorbis, Opus, FLAC, MP3, AAC

          ### Windows Builds

          Three linkage variants, each in **x64** and **x86** (`mux.h` + a
          `README.txt` included in every archive):

          **Shared, external codecs (`muxaudio-windows-{x64,x86}-shared.zip`)**
          - `muxaudio.dll` + `muxaudio.lib` import library
          - Ships the codec DLLs (ogg.dll, vorbis.dll, opus.dll, etc.) alongside
          - Codecs: PCM, Vorbis, Opus, FLAC, MP3, AAC

          **Shared, self-contained (`muxaudio-windows-{x64,x86}-shared-bundled.zip`)**
          - `muxaudio.dll` + `muxaudio.lib` with all codecs linked into the DLL
          - Static CRT; ship **only** `muxaudio.dll` - no external codec DLLs
          - Codecs: PCM, Vorbis, Opus, FLAC, MP3, AAC

          **Static library (`muxaudio-windows-{x64,x86}-static.zip`)**
          - `muxaudio-static.lib` + all codec static `.lib` files
          - No runtime codec DLL dependencies; link everything into your app
          - Codecs: PCM, Vorbis, Opus, FLAC, MP3, AAC

          ### WASM Build

          **Decoder (`muxaudio-wasm-decoder.tar.gz`)**
          - Decoder-only build for browser use
          - Fully static with codecs embedded
          - Files: `muxaudio.js`, `muxaudio.wasm`, `muxaudio.wrapper.js`
          - Codecs: PCM, Vorbis, Opus, FLAC, MP3 (decode only)

          ### Installation

          **Debian/Ubuntu (Recommended):**
          ```bash
          # Install all packages
          sudo apt install ./libmuxaudio0_*.deb ./libmuxaudio-dev_*.deb ./muxaudio-tools_*.deb

          # Or install only what you need:
          sudo apt install ./libmuxaudio0_*.deb ./muxaudio-tools_*.deb  # Runtime only
          sudo apt install ./libmuxaudio0_*.deb ./libmuxaudio-dev_*.deb  # Development
          ```

          **Linux Shared:**
          ```bash
          tar xzf muxaudio-linux-x64-shared.tar.gz
          sudo cp linux-x64-shared/*.so* /usr/local/lib/
          sudo cp linux-x64-shared/mux linux-x64-shared/demux /usr/local/bin/
          sudo ldconfig
          ```

          **Linux Static:**
          ```bash
          tar xzf muxaudio-linux-x64-static.tar.gz
          # See README.txt in the archive for linking instructions
          ```

          **Windows Shared:**
          ```powershell
          Expand-Archive muxaudio-windows-x64-shared.zip
          # Copy all DLL files to your application directory or system PATH
          ```

          **Windows Static:**
          ```powershell
          Expand-Archive muxaudio-windows-x64-static.zip
          # See README.txt in the archive for linking instructions
          ```

          **WASM:**
          ```bash
          tar xzf muxaudio-wasm-decoder.tar.gz
          # Use files in wasm-decoder/ in your web project
          ```
        draft: false
        prerelease: false
        files: |
          release/muxaudio-linux-x64-shared.tar.gz
          release/muxaudio-linux-x64-static.tar.gz
          release/*.deb
          release/muxaudio-windows-x64-shared.zip
          release/muxaudio-windows-x64-shared-bundled.zip
          release/muxaudio-windows-x64-static.zip
          release/muxaudio-windows-x86-shared.zip
          release/muxaudio-windows-x86-shared-bundled.zip
          release/muxaudio-windows-x86-static.zip
          release/muxaudio-wasm-decoder.tar.gz
